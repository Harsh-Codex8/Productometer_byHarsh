<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productometer Dashboard</title>
    <!-- Google Fonts for Cursive Style and Clean UI text -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- 1. Heading -->
        <header class="dashboard-header">
            <h1 class="logo-title">Productometer</h1>
            <!-- Upgraded Control Action Buttons Group with local PNGs -->
            <div class="header-action-controls">
                <button class="action-btn new-btn" id="newDayBtn">
                    <img src="./new.png" alt="New" class="btn-local-icon"> New
                </button>
                <button class="action-btn save-btn" id="saveDataBtn">
                    <img src="./save.png" alt="Save" class="btn-local-icon"> Save Data
                </button>
            </div>
        </header>

        <!-- 2. Scale (Timeline Tracker) -->
        <section class="timeline-section">
            <div class="capsule-timeline" id="mainTimeline">
                <!-- JavaScript loop injects 48 slots here -->
            </div>
            <div class="timeline-labels">
                <span>12 AM</span>
                <span>6 AM</span>
                <span>12 PM</span>
                <span>6 PM</span>
                <span>12 AM</span>
            </div>
        </section>

        <!-- 3. Options (Activity Control Grid with Custom PNG Images) -->
        <section class="activity-grid">
            
            <div class="activity-capsule academics" data-activity="academics">
                <div class="icon-wrapper"><img src="./Academics.png" alt="Academics" class="local-icon"></div>
                <span class="activity-name">Academics</span>
                <span class="hours-display" id="hrs-academics">0.0h</span>
            </div>

            <div class="activity-capsule health" data-activity="health">
                <div class="icon-wrapper"><img src="./Health.png" alt="Health" class="local-icon"></div>
                <span class="activity-name">Health</span>
                <span class="hours-display" id="hrs-health">0.0h</span>
            </div>

            <div class="activity-capsule skills" data-activity="skills">
                <div class="icon-wrapper"><img src="./Skills.png" alt="Skills" class="local-icon"></div>
                <span class="activity-name">Skills</span>
                <span class="hours-display" id="hrs-skills">0.0h</span>
            </div>

            <div class="activity-capsule screen" data-activity="screen">
                <div class="icon-wrapper"><img src="./Screen.png" alt="Screen" class="local-icon"></div>
                <span class="activity-name">Screen</span>
                <span class="hours-display" id="hrs-screen">0.0h</span>
            </div>

            <div class="activity-capsule school" data-activity="school">
                <div class="icon-wrapper"><img src="./school.png" alt="School" class="local-icon"></div>
                <span class="activity-name">School</span>
                <span class="hours-display" id="hrs-school">0.0h</span>
            </div>

            <div class="activity-capsule sleep" data-activity="sleep">
                <div class="icon-wrapper"><img src="./Sleep.png" alt="Sleep" class="local-icon"></div>
                <span class="activity-name">Sleep</span>
                <span class="hours-display" id="hrs-sleep">0.0h</span>
            </div>

            <div class="activity-capsule other" data-activity="other">
                <div class="icon-wrapper"><img src="./Others.png" alt="Other" class="local-icon"></div>
                <span class="activity-name">Other</span>
                <span class="hours-display" id="hrs-other">0.0h</span>
            </div>

        </section>

        <!-- 4. Gauge Display Panel -->
        <section class="visualization-center">
            <div class="gauge-card">
                <canvas id="gaugeCanvas" width="320" height="260"></canvas>
                <div class="gauge-readout">
                    <span id="gaugeValue">0</span>
                    <span class="gauge-unit">Productivity Score</span>
                </div>
            </div>
        </section>

        <!-- 5. Graph Display Panel -->
        <section class="graph-section">
            <div class="graph-card">
                <div class="card-header-label">Productivity Trend Timeline</div>
                <div class="canvas-wrapper">
                    <canvas id="trendGraphCanvas" width="560" height="200"></canvas>
                </div>
            </div>
        </section>

    </div>

    <script src="./script.js"></script>
</body>
</html>
